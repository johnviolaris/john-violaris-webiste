name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test security boundaries and enquiry validation
        run: npm test

      - name: Verify CMS seed parity
        run: npm run cms:verify

      - name: Verify SEO rules
        run: npm run seo:verify

      - name: Build
        run: npm run build

      - name: Verify rendered public pages and structured data
        shell: bash
        run: |
          npm start &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              break
            fi

            if ! kill -0 "$server_pid" 2>/dev/null; then
              wait "$server_pid"
              exit 1
            fi

            sleep 1
          done

          curl --fail --silent http://127.0.0.1:3000/ > /dev/null
          npm run runtime:verify -- http://127.0.0.1:3000
          npm run pages:verify -- http://127.0.0.1:3000
          npm run assets:verify -- http://127.0.0.1:3000
          npm run schema:verify -- http://127.0.0.1:3000
          npm run lighthouse:ci

      - name: Retain Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.118.0

      - name: Apply migrations to a fresh local database
        run: supabase db start

      - name: Run pgTAP database tests
        run: supabase test db
